<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>大学進学にともなう都道府県間移動 2015-2025</title>
<link rel="stylesheet" href="shared/base.css?v=c6e90a9e">
<style>
  .legend .bar { width: 200px; height: 10px; border-radius: 2px; border: 1px solid var(--border); }
  .legend .ticks {
    position: relative;
    width: 220px;
    height: 14px;
    font-size: 10px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .legend .ticks span { position: absolute; transform: translateX(-50%); white-space: nowrap; }
  .legend .swatch {
    display: inline-block;
    width: 10px;
    height: 10px;
    background: var(--diagonal);
    border: 1px solid var(--border);
    vertical-align: -1px;
    margin-right: 4px;
  }

  .summary { display: flex; gap: 28px; flex-wrap: wrap; margin: 18px 0 0; }
  .stat .label { font-size: 11px; color: var(--muted); letter-spacing: 0.02em; }
  .stat .value { font-size: 19px; font-variant-numeric: tabular-nums; }
  .stat .value small { font-size: 12px; color: var(--text-secondary); }
</style>
</head>
<body>
<div class="wrap">
  <h1>大学進学にともなう都道府県間移動</h1>

  <div id="viz-chrome"></div>

  <div class="panel">
    <div class="controls">
      <span class="field">
        セルの色
        <span class="segmented" role="group" aria-label="セルの色が表すもの">
          <button type="button" id="mode-count" aria-pressed="true">入学者数</button>
          <button type="button" id="mode-share" aria-pressed="false">行き先の割合</button>
        </span>
        <span class="note" id="mode-note"></span>
      </span>
    </div>

    <p class="about">
      縦軸が出身高校の所在地、横軸が入学した大学（学部）の所在地。
      左上から右下に伸びる対角線上は県内進学。
      出典は文部科学省「学校基本調査」の各年度「出身高校の所在地県別入学者数」。
    </p>

    <p class="hints">
      <span>セルにカーソルを合わせると内訳</span>
      <span>クリックで固定、再クリックで解除</span>
      <span>選んだ県はフロー図・設置数のタブへ引き継ぐ</span>
    </p>

    <div class="chart">
      <canvas id="heatmap"></canvas>
      <div class="tooltip" id="tooltip" role="status" aria-live="polite"></div>
    </div>

    <div class="legend">
      <span id="legend-title">入学者数</span>
      <div>
        <div class="bar" id="legend-bar"></div>
        <div class="ticks" id="legend-ticks"></div>
      </div>
      <span hidden id="diagonal-note"><span class="swatch"></span>対角 = 県内進学（分母から除外）</span>
    </div>

    <div class="summary">
      <div class="stat">
        <div class="label">県外進学者</div>
        <div class="value" id="stat-movers">–</div>
      </div>
      <div class="stat">
        <div class="label">県外進学率</div>
        <div class="value" id="stat-rate">–</div>
      </div>
      <div class="stat">
        <div class="label">最大の純流入</div>
        <div class="value" id="stat-top-in">–</div>
      </div>
      <div class="stat">
        <div class="label">最大の純流出</div>
        <div class="value" id="stat-top-out">–</div>
      </div>
    </div>

    <details>
      <summary id="table-summary">表で見る（選択年の上位40流動）</summary>
      <div id="table-host"></div>
    </details>
  </div>

  <footer>
    「その他」（海外・不明の高校出身）は都道府県に対応付けられないため除外している。
  </footer>
</div>

<script src="data.js?v=220726bf"></script>
<script src="shared/theme.js?v=044e1c62"></script>
<script src="shared/format.js?v=a82415ab"></script>
<script src="shared/state.js?v=bcd0f174"></script>
<script src="shared/chrome.js?v=cf8944fb"></script>
<script src="shared/flowtable.js?v=91b3a135"></script>
<script>
(() => {
  "use strict";

  if (VIZ.state.redirectIfNeeded("heatmap")) return;

  // アドレス欄を書き換えられたときと戻る操作。状態を継ぎ足すより読み直すほうが確実。
  VIZ.state.onChange(() => window.location.reload());

  const N = OD_DATA.prefectures.length;
  const YEARS = OD_DATA.years;
  const format = VIZ.format;

  // 逐次配色（青、100→700）。明色モードでは最も薄い段が背景に溶け、ゼロ付近が自然に沈む。
  const RAMP = [
    "#cde2fb", "#b7d3f6", "#9ec5f4", "#86b6ef", "#6da7ec", "#5598e7", "#3987e5",
    "#2a78d6", "#256abf", "#1c5cab", "#184f95", "#104281", "#0d366b",
  ];
  const DARK_SURFACE = "#1a1a19";

  const CELL = 16;
  const PAD = { top: 92, right: 8, bottom: 8, left: 96 };
  // 上端・左端は外から順に「軸見出し / 地方名 / 県名」の3段に切る。
  const TITLE_AT = 18;
  const REGION_AT = 46;
  const WIDTH = PAD.left + CELL * N + PAD.right;
  const HEIGHT = PAD.top + CELL * N + PAD.bottom;

  const canvas = document.getElementById("heatmap");
  const ctx = canvas.getContext("2d");
  const tooltip = document.getElementById("tooltip");

  // ---- 尺度 ----------------------------------------------------------------
  // 年をまたいで比較できるよう、色の定義域は全年度で固定する。
  let maxCount = 0;
  let maxShare = 0;
  for (let y = 0; y < YEARS.length; y += 1) {
    for (let i = 0; i < N; i += 1) {
      const outbound = OD_DATA.outbound[y][i];
      for (let j = 0; j < N; j += 1) {
        const value = OD_DATA.matrix[y][i][j];
        if (value > maxCount) maxCount = value;
        if (i !== j && outbound > 0) {
          const share = value / outbound;
          if (share > maxShare) maxShare = share;
        }
      }
    }
  }

  const EMPTY = -1;     // 値ゼロ
  const DIAGONAL = -2;  // 構成比モードの対角（県内進学は分母に含めない）

  // 実数は桁の開きが大きい（数人〜5万人超）。対数だと数十人のセルまで濃く出て
  // 全体が青一色に潰れるため、小さい値を沈めるべき乗スケールを使う。
  const COUNT_EXPONENT = 0.35;
  const countPosition = (value) => Math.pow(value / maxCount, COUNT_EXPONENT);

  // 正規化済みの色位置を全年度・両モードぶん先に作る。描画をループから外すため。
  const scaled = { count: [], share: [] };
  for (let y = 0; y < YEARS.length; y += 1) {
    const count = new Float32Array(N * N);
    const share = new Float32Array(N * N);
    for (let i = 0; i < N; i += 1) {
      const outbound = OD_DATA.outbound[y][i];
      for (let j = 0; j < N; j += 1) {
        const value = OD_DATA.matrix[y][i][j];
        const at = i * N + j;
        count[at] = value === 0 ? EMPTY : countPosition(value);
        if (i === j) share[at] = DIAGONAL;
        else if (value === 0 || outbound === 0) share[at] = EMPTY;
        else share[at] = Math.sqrt(value / outbound / maxShare);
      }
    }
    scaled.count.push(count);
    scaled.share.push(share);
  }

  const regionEdges = [];
  {
    let at = 0;
    for (const region of OD_DATA.regions) {
      regionEdges.push({ name: region.name, start: at, end: at + region.size });
      at += region.size;
    }
  }

  // ---- 状態 ----------------------------------------------------------------
  const saved = VIZ.state.get();
  const state = {
    mode: saved.mode,
    hover: null,        // {row, col}
    // 県だけを指定して開かれたときは、その県の対角セル（県内進学）を選んだ状態にする。
    // 行と列の両方が引き立ち、「その県に注目している」状態が図の上で見える。
    pinned: saved.pref === null
      ? null
      : { row: format.toIndex(saved.pref), col: format.toIndex(saved.pref) },
  };

  // 暗色モードは順序を反転する。ただし反転しただけでは最小値が濃紺のまま光り、
  // 「ほぼゼロ」が背景と別物に見えて盤面全体が埋まる。明色側で最も薄い段が紙に
  // 溶けるのと同じ状態を作るため、最下段を背景色そのものに置き、そこから立ち上げる。
  function darkRamp() {
    const reversed = RAMP.slice().reverse();
    const foot = [1, 0.82, 0.6, 0.32].map((t) => VIZ.theme.blend(reversed[0], DARK_SURFACE, t));
    return [...foot, ...reversed];
  }

  let theme = VIZ.theme.read();
  let ramp = VIZ.theme.isDark() ? darkRamp() : RAMP;

  function rampColor(position) {
    const clamped = Math.max(0, Math.min(1, position));
    const scaledPosition = clamped * (ramp.length - 1);
    const low = Math.floor(scaledPosition);
    const high = Math.min(ramp.length - 1, low + 1);
    return VIZ.theme.blend(ramp[low], ramp[high], scaledPosition - low);
  }

  // ---- 描画 ----------------------------------------------------------------
  function resize() {
    const ratio = window.devicePixelRatio || 1;
    canvas.width = WIDTH * ratio;
    canvas.height = HEIGHT * ratio;
    canvas.style.width = `${WIDTH}px`;
    canvas.style.height = `${HEIGHT}px`;
    ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
    draw();
  }

  function frameValues() {
    const frames = scaled[state.mode];
    const { low, high, f } = VIZ.chrome.frame();
    return { low: frames[low], high: frames[high], f };
  }

  // 補間中に片方だけ空セルの場合、色は「空 = 0」として扱い連続に見せる。
  function blend(low, high, f, at) {
    const a = low[at];
    const b = high[at];
    if (a === DIAGONAL || b === DIAGONAL) return DIAGONAL;
    if (a === EMPTY && b === EMPTY) return EMPTY;
    const va = a === EMPTY ? 0 : a;
    const vb = b === EMPTY ? 0 : b;
    return va + (vb - va) * f;
  }

  function draw() {
    const { low, high, f } = frameValues();
    const focus = state.pinned || state.hover;

    ctx.fillStyle = theme.surface;
    ctx.fillRect(0, 0, WIDTH, HEIGHT);

    for (let i = 0; i < N; i += 1) {
      const y = PAD.top + i * CELL;
      for (let j = 0; j < N; j += 1) {
        const value = blend(low, high, f, i * N + j);
        if (value === EMPTY) continue;
        ctx.fillStyle = value === DIAGONAL ? theme.diagonal : rampColor(value);
        // 隣接セルの境目を 1px 空け、塊が一枚のベタ面に潰れないようにする。
        ctx.fillRect(PAD.left + j * CELL, y, CELL - 1, CELL - 1);
      }
    }

    // 地方ブロックの区切り
    ctx.strokeStyle = theme.axis;
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (const region of regionEdges) {
      if (region.start === 0) continue;
      const offset = Math.round(region.start * CELL) - 0.5;
      ctx.moveTo(PAD.left + offset, PAD.top);
      ctx.lineTo(PAD.left + offset, PAD.top + N * CELL);
      ctx.moveTo(PAD.left, PAD.top + offset);
      ctx.lineTo(PAD.left + N * CELL, PAD.top + offset);
    }
    ctx.stroke();

    drawLabels(focus);
    drawFocus(focus);
  }

  function drawLabels(focus) {
    ctx.font = "10px system-ui, -apple-system, 'Hiragino Sans', sans-serif";
    ctx.textBaseline = "middle";

    // 行（出身高校の所在地）
    ctx.textAlign = "right";
    for (let i = 0; i < N; i += 1) {
      ctx.fillStyle = focus && focus.row === i ? theme.text : theme.muted;
      ctx.fillText(format.short(i), PAD.left - 5, PAD.top + i * CELL + CELL / 2 - 0.5);
    }

    // 列（大学の所在地）
    ctx.textAlign = "left";
    for (let j = 0; j < N; j += 1) {
      ctx.save();
      ctx.translate(PAD.left + j * CELL + CELL / 2 - 0.5, PAD.top - 5);
      ctx.rotate(-Math.PI / 2);
      ctx.fillStyle = focus && focus.col === j ? theme.text : theme.muted;
      ctx.fillText(format.short(j), 0, 0);
      ctx.restore();
    }

    // 地方名の帯
    ctx.fillStyle = theme.secondary;
    ctx.textAlign = "center";
    for (const region of regionEdges) {
      const center = (region.start + region.end) / 2 * CELL;
      ctx.fillText(region.name, PAD.left + center, REGION_AT);
      ctx.save();
      ctx.translate(REGION_AT, PAD.top + center);
      ctx.rotate(-Math.PI / 2);
      ctx.fillText(region.name, 0, 0);
      ctx.restore();
    }

    // 軸の見出し。列・行それぞれの中央に置く。
    ctx.fillStyle = theme.text;
    const middle = N * CELL / 2;
    ctx.fillText("大学の所在地", PAD.left + middle, TITLE_AT);
    ctx.save();
    ctx.translate(TITLE_AT, PAD.top + middle);
    ctx.rotate(-Math.PI / 2);
    ctx.fillText("出身高校の所在地", 0, 0);
    ctx.restore();
  }

  function drawFocus(focus) {
    if (!focus) return;
    const x = PAD.left + focus.col * CELL;
    const y = PAD.top + focus.row * CELL;

    ctx.save();
    ctx.fillStyle = theme.dark ? "rgba(255,255,255,0.10)" : "rgba(11,11,11,0.07)";
    ctx.fillRect(PAD.left, y, N * CELL, CELL - 1);
    ctx.fillRect(x, PAD.top, CELL - 1, N * CELL);
    ctx.restore();

    ctx.strokeStyle = theme.text;
    ctx.lineWidth = 2;
    ctx.strokeRect(x - 1, y - 1, CELL + 1, CELL + 1);
  }

  // ---- ツールチップ --------------------------------------------------------
  function showTooltip(cell, clientX, clientY) {
    const y = VIZ.chrome.yearIndex();
    const { row, col } = cell;
    const value = OD_DATA.matrix[y][row][col];
    const outbound = OD_DATA.outbound[y][row];
    const inbound = OD_DATA.inbound[y][col];
    const origin = format.name(row);
    const destination = format.name(col);
    const delta = value - OD_DATA.matrix[0][row][col];

    const lines = [];
    if (row === col) {
      lines.push(`<strong>${origin} 県内進学</strong>`);
      lines.push(`<span class="num">${format.count(value)}</span> 人`);
      lines.push(`<span class="sub">県内進学率 ${format.share(value / (value + outbound))}</span>`);
    } else {
      lines.push(`<strong>${origin} → ${destination}</strong>`);
      lines.push(`<span class="num">${format.count(value)}</span> 人`);
      lines.push(`<span class="sub">${origin}の県外進学者の `
        + `${outbound ? format.share(value / outbound) : "–"}</span>`);
      lines.push(`<span class="sub">${destination}への流入の `
        + `${inbound ? format.share(value / inbound) : "–"}</span>`);
    }
    lines.push(`<span class="sub">${YEARS[y]}年度 / 2015年度比 `
      + `<span class="num">${format.signed(delta)}</span></span>`);

    tooltip.innerHTML = lines.join("<br>");
    tooltip.style.opacity = "1";

    const bounds = canvas.getBoundingClientRect();
    const width = tooltip.offsetWidth;
    const height = tooltip.offsetHeight;
    let left = clientX - bounds.left + 14;
    let top = clientY - bounds.top + 14;
    if (left + width > bounds.width) left = clientX - bounds.left - width - 14;
    if (top + height > bounds.height) top = clientY - bounds.top - height - 14;
    tooltip.style.left = `${Math.max(0, left)}px`;
    tooltip.style.top = `${Math.max(0, top)}px`;
  }

  function hideTooltip() {
    tooltip.style.opacity = "0";
  }

  // 固定中のセルは年をまたいでも数値を追随させる。canvas は CSS で縮む場合がある。
  function showPinned() {
    if (!state.pinned) return;
    const bounds = canvas.getBoundingClientRect();
    const scale = bounds.width / WIDTH;
    showTooltip(state.pinned,
      bounds.left + (PAD.left + state.pinned.col * CELL + CELL) * scale,
      bounds.top + (PAD.top + state.pinned.row * CELL + CELL) * scale);
  }

  function cellAt(event) {
    const bounds = canvas.getBoundingClientRect();
    const scale = WIDTH / bounds.width;
    const x = (event.clientX - bounds.left) * scale - PAD.left;
    const y = (event.clientY - bounds.top) * scale - PAD.top;
    const col = Math.floor(x / CELL);
    const row = Math.floor(y / CELL);
    if (row < 0 || col < 0 || row >= N || col >= N) return null;
    return { row, col };
  }

  // 注目県として外へ渡すのは行、つまり出身県のほう。どの県から出た流れを見ているかが主語になる。
  function setPinned(cell, { silent = false } = {}) {
    state.pinned = cell;
    if (!silent) VIZ.state.patch({ pref: cell === null ? null : format.toJis(cell.row) });
    if (!cell) hideTooltip();
    renderTable(VIZ.chrome.yearIndex());
    draw();
  }

  canvas.addEventListener("mousemove", (event) => {
    const cell = cellAt(event);
    state.hover = cell;
    if (cell) showTooltip(state.pinned || cell, event.clientX, event.clientY);
    else if (!state.pinned) hideTooltip();
    draw();
  });

  canvas.addEventListener("mouseleave", () => {
    state.hover = null;
    if (!state.pinned) hideTooltip();
    draw();
  });

  canvas.addEventListener("click", (event) => {
    const cell = cellAt(event);
    if (!cell) return;
    const same = state.pinned && state.pinned.row === cell.row && state.pinned.col === cell.col;
    setPinned(same ? null : cell);
    if (state.pinned) showTooltip(state.pinned, event.clientX, event.clientY);
  });

  // ---- 凡例 ----------------------------------------------------------------
  const legendBar = document.getElementById("legend-bar");
  const legendTicks = document.getElementById("legend-ticks");
  const legendTitle = document.getElementById("legend-title");
  const diagonalNote = document.getElementById("diagonal-note");

  function renderLegend() {
    const stops = ramp.map((hex, index) =>
      `${hex} ${(index / (ramp.length - 1) * 100).toFixed(1)}%`);
    legendBar.style.background = `linear-gradient(to right, ${stops.join(", ")})`;

    const ticks = [];
    if (state.mode === "count") {
      legendTitle.textContent = "入学者数（非線形）";
      diagonalNote.hidden = true;
      for (const value of [100, 1000, 10000, 50000]) {
        if (value > maxCount) break;
        ticks.push({ at: countPosition(value), text: format.count(value) });
      }
    } else {
      legendTitle.textContent = "出身県の県外進学者に占める割合（非線形）";
      diagonalNote.hidden = false;
      for (const value of [0.01, 0.1, 0.2, 0.4]) {
        if (value > maxShare) break;
        ticks.push({ at: Math.sqrt(value / maxShare), text: `${(value * 100).toFixed(0)}%` });
      }
    }
    legendTicks.innerHTML = ticks
      .map((tick) => `<span style="left:${(tick.at * 100).toFixed(1)}%">${tick.text}</span>`)
      .join("");
  }

  // ---- 要約とテーブル ------------------------------------------------------
  const statMovers = document.getElementById("stat-movers");
  const statRate = document.getElementById("stat-rate");
  const statTopIn = document.getElementById("stat-top-in");
  const statTopOut = document.getElementById("stat-top-out");
  const tableHost = document.getElementById("table-host");
  const tableSummary = document.getElementById("table-summary");
  let renderedYear = -1;

  function renderYearDetails() {
    const y = VIZ.chrome.yearIndex();
    renderTable(y);
    if (y === renderedYear) return;
    renderedYear = y;

    let movers = 0;
    let entrants = 0;
    let topIn = 0;
    let topOut = 0;
    for (let i = 0; i < N; i += 1) {
      movers += OD_DATA.outbound[y][i];
      entrants += OD_DATA.outbound[y][i] + OD_DATA.local[y][i];
      if (OD_DATA.netInflow[y][i] > OD_DATA.netInflow[y][topIn]) topIn = i;
      if (OD_DATA.netInflow[y][i] < OD_DATA.netInflow[y][topOut]) topOut = i;
    }
    statMovers.textContent = `${format.count(movers)} 人`;
    statRate.textContent = format.share(movers / entrants);
    statTopIn.innerHTML = `${format.short(topIn)} `
      + `<small>${format.signed(OD_DATA.netInflow[y][topIn])}</small>`;
    statTopOut.innerHTML = `${format.short(topOut)} `
      + `<small>${format.signed(OD_DATA.netInflow[y][topOut])}</small>`;

  }

  // 表は年度と注目県の両方で変わる。県は行（出身県）を主語に取る。図で選んだ県が
  // 表の側でも主語になり、フロー図のタブへ移っても同じ県の表が続く。
  const ALL_PAIRS = [];
  for (let i = 0; i < N; i += 1) {
    for (let j = 0; j < N; j += 1) {
      if (i !== j) ALL_PAIRS.push({ i, j });
    }
  }

  let tableKey = "";

  function renderTable(y) {
    const focus = state.pinned === null ? null : state.pinned.row;
    const key = `${y}|${focus}`;
    if (key === tableKey) return;
    tableKey = key;

    tableSummary.textContent =
      VIZ.flowtable.summaryText(focus, "表で見る（選択年の上位40流動）");
    VIZ.flowtable.render(tableHost, {
      year: y,
      focus,
      flows: ALL_PAIRS,
      limit: focus === null ? 40 : 20,
    });
  }

  // ---- モード切替 ----------------------------------------------------------
  const modeButtons = {
    count: document.getElementById("mode-count"),
    share: document.getElementById("mode-share"),
  };
  const modeNote = document.getElementById("mode-note");

  // 2つのモードは分母が違う。どちらも「濃いほど多い」だが、比べている相手が違う。
  // ボタンの語だけでは伝わらないので、選んだほうの意味をその場で言い切る。
  const MODE_MEANING = {
    count: "濃さは入学者数そのもの。大きい県どうしの太い流れが目立つ。",
    share: "濃さは、出身県の県外進学者を100%としたときの行き先の割合。小さい県の向かう先が見える。",
  };

  function setMode(mode, { silent = false } = {}) {
    state.mode = mode;
    for (const [key, other] of Object.entries(modeButtons)) {
      other.setAttribute("aria-pressed", key === mode ? "true" : "false");
    }
    modeNote.textContent = MODE_MEANING[mode];
    if (!silent) VIZ.state.patch({ mode });
    renderLegend();
    draw();
  }

  for (const mode of Object.keys(modeButtons)) {
    modeButtons[mode].addEventListener("click", () => setMode(mode));
  }

  // ---- 起動 ----------------------------------------------------------------
  window.addEventListener("resize", resize);

  VIZ.chrome.mount({
    view: "heatmap",
    onYear: () => {
      renderYearDetails();
      showPinned();
      draw();
    },
    onTheme: () => {
      theme = VIZ.theme.read();
      ramp = VIZ.theme.isDark() ? darkRamp() : RAMP;
      renderLegend();
      draw();
    },
  });

  setMode(state.mode, { silent: true });
  setPinned(state.pinned, { silent: true });
  renderYearDetails();
  resize();
  showPinned();
})();
</script>
</body>
</html>
